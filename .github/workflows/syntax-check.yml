name: Static source check
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Parse Python and JSON sources (no runtime dependencies)
        run: python tools/validate_release.py
